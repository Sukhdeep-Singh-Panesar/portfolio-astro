<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">PChat — project illustration</title>
  <desc id="desc">A premium dark blue and violet vector illustration with abstract connected chat bubbles. This is concept artwork, not an application screenshot.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090E1C"/>
      <stop offset=".52" stop-color="#101B35"/>
      <stop offset="1" stop-color="#13132E"/>
    </linearGradient>
    <radialGradient id="glow1"><stop stop-color="#6366F1" stop-opacity=".52"/><stop offset="1" stop-color="#6366F1" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow2"><stop stop-color="#22D3EE" stop-opacity=".27"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7778FF"/>
      <stop offset="1" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="secondary" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#65E7EA"/>
      <stop offset="1" stop-color="#6389FA"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#A5B4FC"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#A5B4FC" stroke-width=".8" opacity=".07"/>
    </pattern>
    <filter id="drop" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16" result="blur"/>
      <feOffset dy="14" result="offset"/>
      <feComponentTransfer in="offset" result="shadow"><feFuncA type="linear" slope=".32"/></feComponentTransfer>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><rect width="1200" height="720" rx="32"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="720" fill="url(#bg)"/>
    <rect width="1200" height="720" fill="url(#grid)"/>
    <ellipse cx="930" cy="302" rx="450" ry="390" fill="url(#glow1)"/>
    <ellipse cx="753" cy="589" rx="410" ry="310" fill="url(#glow2)"/>
    <path d="M0 627C233 552 418 737 647 653S1021 553 1200 645" fill="none" stroke="#818CF8" stroke-opacity=".12" stroke-width="2"/>
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <rect x="74" y="80" width="132" height="36" rx="18" fill="#6366F1" fill-opacity=".12" stroke="#818CF8" stroke-opacity=".35"/>
      <circle cx="94" cy="98" r="5" fill="#67E8F9"/>
      <text x="109" y="103" font-size="14" font-weight="650" letter-spacing="1.5" fill="#C7D2FE">PROJECT</text>
      <text x="72" y="281" font-size="105" font-weight="750" letter-spacing="-5" fill="#F8FAFC">P<tspan fill="url(#accent)">Chat</tspan></text>
      <text x="76" y="332" font-size="26" letter-spacing=".1" fill="#CBD5E1">Conversations, connected.</text>
      <path d="M76 373H416" stroke="#A5B4FC" stroke-opacity=".25" stroke-width="2"/>
      <text x="76" y="413" font-size="17" font-weight="600" letter-spacing="2.4" fill="#A5B4FC">MESSAGING PLATFORM</text>
      <text x="76" y="448" font-size="17" fill="#94A3B8">Project illustration · In development</text>
      <rect x="76" y="534" width="154" height="41" rx="20.5" fill="#818CF8" fill-opacity=".14" stroke="#A5B4FC" stroke-opacity=".36"/>
      <text x="153" y="561" font-size="15" text-anchor="middle" fill="#C7D2FE" font-weight="600">NEXT.JS</text>
      <rect x="242" y="534" width="151" height="41" rx="20.5" fill="#67E8F9" fill-opacity=".10" stroke="#67E8F9" stroke-opacity=".30"/>
      <text x="317" y="561" font-size="15" text-anchor="middle" fill="#A5F3FC" font-weight="600">NESTJS</text>
    </g>
    <g filter="url(#drop)">
      <g transform="translate(660 137) rotate(-7 175 152)">
        <rect x="0" y="0" width="380" height="240" rx="45" fill="url(#bubble)"/>
        <path d="M63 226L64 284L146 238" fill="#5458EA"/>
        <rect x="60" y="70" width="260" height="20" rx="10" fill="#E0E7FF" fill-opacity=".85"/>
        <rect x="60" y="113" width="212" height="18" rx="9" fill="#C7D2FE" fill-opacity=".7"/>
        <rect x="60" y="153" width="155" height="18" rx="9" fill="#C7D2FE" fill-opacity=".48"/>
        <circle cx="330" cy="183" r="11" fill="#67E8F9"/>
      </g>
      <g transform="translate(850 365) rotate(7 130 85)">
        <rect x="0" y="0" width="295" height="170" rx="36" fill="#142C4D" stroke="#67E8F9" stroke-opacity=".6" stroke-width="2"/>
        <path d="M246 158L253 208L197 166" fill="#142C4D" stroke="#67E8F9" stroke-opacity=".55" stroke-width="2" stroke-linejoin="round"/>
        <rect x="43" y="52" width="208" height="17" rx="8.5" fill="url(#secondary)"/>
        <rect x="43" y="89" width="169" height="15" rx="7.5" fill="#8AA6D3" fill-opacity=".65"/>
        <circle cx="250" cy="118" r="8" fill="#67E8F9"/>
      </g>
    </g>
    <g fill="#67E8F9">
      <circle cx="650" cy="128" r="6" opacity=".65"/>
      <circle cx="1132" cy="262" r="4" opacity=".7"/>
      <circle cx="751" cy="542" r="4" opacity=".5"/>
    </g>
    <path d="M629 121L657 110M1140 269l21 21M734 565l19-7" stroke="#A5B4FC" stroke-width="2" opacity=".35"/>
  </g>
</svg>
